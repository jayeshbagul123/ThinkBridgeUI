<div class="container mt-4">
  <h2 class="mt-3">Category List</h2>
  <div class="d-flex justify-content-end mt-3">
        <a [routerLink]="['/admin','categories','add']" class="btn btn-primary">Add Category</a>
  </div>
  
  <div>
    @if (isLoading()) {
      <p>Loading categories...</p>
    }
    @if(isError()){
      <p>There has been an error....</p>
    }@else {
      <table class="table table-bordered mt-3">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Url Handle</th>
            <th></th>
            <th></th>
          </tr>
          <tbody>
             @for (item of value(); track $index) {
          <tr>
            <td>{{item.name}}</td>
            <td>{{item.urlHandle}}</td>
            <td>
              <a class="btn btn-sm btn-outline-primary" [routerLink]="['/admin/categories/edit',item.id]" >Edit</a>
            </td>
            <td>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteCategory(item.id)">Delete</button>
            </td>
          </tr>
        }
          </tbody>
       
      </table>    
    }
  </div>
</div>
