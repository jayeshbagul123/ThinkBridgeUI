<div class="container">
    <h1>Add Blog Post</h1>
    <form [formGroup]="addBlogpostForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" formControlName="title">
        </div>
        <div class="mb-3">
            <label for="shortDescription" class="form-label">Short Description</label>
            <textarea class="form-control" id="shortDescription" rows="2" formControlName="shortDescription"></textarea>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">Content</label>
            <textarea class="form-control" id="content" rows="5" formControlName="content"></textarea>
        </div>
        <div class="mb-3">
            <label for="featuredImageUrl" class="form-label">Featured Image URL</label>
            <input type="url" class="form-control" id="featuredImageUrl" formControlName="featuredImageUrl">
        </div>
        <div class="mb-3">
            <label for="urlHandle" class="form-label">URL Handle</label>
            <input type="text" class="form-control" id="urlHandle" formControlName="urlHandle">
        </div>
        <div class="mb-3">
            <label for="publishedDate" class="form-label">Published Date</label>
            <input type="date" class="form-control" id="publishedDate" formControlName="publishedDate">
        </div>
        <div class="mb-3">
            <label for="author" class="form-label">Author</label>
            <input type="text" class="form-control" id="author" formControlName="author">
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="isVisible" formControlName="isVisible">
            <label for="isVisible" class="form-check-label">Visible</label>
        </div>
        <button type="submit" class="btn btn-primary" >Submit</button>
    </form>
</div>
